<app-page-header [title]="'Width'"  [icon]="'slack'"  [title1]="'Utilities'" [activeitem]="'Width'"></app-page-header>


	<!-- Row -->
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        Width Values
                    </div>
                </div>
                <div class="card-body">
                    <div class="d-flex">
                        <div class="d-flex align-items-center justify-content-center wd-50 ht-100 bg-light me-4">
                            .wd-50
                        </div>
                        <div class="d-flex align-items-center justify-content-center wd-100 ht-100 bg-light me-4">
                            .wd-100
                        </div>
                        <div class="d-flex align-items-center justify-content-center wd-150 ht-100 bg-light ">
                            .wd-150
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered text-nowrap mt-4">
                            <tbody>
                                <tr>
                                    <td class="w-20"><b>Classes</b></td>
                                    <td><code>.wd-[value]</code></td>
                                </tr>
                                <tr>
                                    <td class="w-20"><b>Values</b></td>
                                    <td>1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered text-nowrap mt-4">
                            <tbody>
                                <tr>
                                    <td  class="w-20"><b>Classes</b></td>
                                    <td><code>.wd-[value]</code></td>
                                </tr>
                                <tr>
                                    <td class="w-20"><b>Values</b></td>
                                    <td>100h | 150 | 200 | 250 | 300 | ... | 500 &nbsp; (step of 50) Bigger Height</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered text-nowrap mt-4 mb-0">
                            <tbody>
                                <tr>
                                    <td  class="w-20"><b>Classes</b></td>
                                    <td><code>.wd-[value]</code></td>
                                </tr>
                                <tr>
                                    <td class="w-20"><b>Values</b></td>
                                    <td>10 | 15 | 20 | 25 | 30 | ... | 100 &nbsp; (step of 5) % Percentage Height</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
