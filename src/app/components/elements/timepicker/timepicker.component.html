<!--Page header-->
<app-page-header [title]="'Time Picker'"  [icon]="'server'"  [title1]="'Elements'" [activeitem]="'Time Picker'"></app-page-header>

<!--End Page header-->

<div class="row">
    <div class="col-md-12 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Basic TimePicker</h3>
            </div>
            <div class="card-body ">
                <ngb-timepicker [(ngModel)]="time"></ngb-timepicker>
                
                <!---Prism Pre code-->
                <figure class="highlight mb-0" id="element1">
                    <ul ngbNav #nav1="ngbNav" class="nav nav-tabs">
                        <li [ngbNavItem]="1">
                            <a ngbNavLink class="html-code"><i class="las la-code mr-2"></i> HTML</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="html1"></code></pre>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="html-code">TS</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="ts1"></code></pre>
                            </ng-template>
                        </li>
                        <div ngxClipboard class="clipboard-icon ms-auto my-auto"  placement="top"
                        ngbTooltip="Copy To Clipboard"><i class="las la-paste"></i></div>
                    </ul>
                    <div [ngbNavOutlet]="nav1"></div>
                    
                    
                </figure>
                <!---Prism Pre code-->
            </div>
        
        </div>
        
    </div>

    <div class="col-md-12 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Meridian TimePicker</h3>
            </div>
            <div class="card-body ">
                <ngb-timepicker [(ngModel)]="mtime" [meridian]="meridian"></ngb-timepicker>
                <br>
                <button class="btn btn-sm btn-outline-{{meridian ? 'success' : 'danger'}}" (click)="toggleMeridian()">
                    Meridian - {{meridian ? "ON" : "OFF"}}
                </button>
                
                <!---Prism Pre code-->
                <figure class="highlight mb-0" id="element1">
                    <ul ngbNav #nav2="ngbNav" class="nav nav-tabs">
                        <li [ngbNavItem]="1">
                            <a ngbNavLink class="html-code"><i class="las la-code mr-2"></i> HTML</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="html2"></code></pre>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="html-code">TS</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="ts2"></code></pre>
                            </ng-template>
                        </li>
                        <div ngxClipboard class="clipboard-icon ms-auto my-auto"  placement="top"
                        ngbTooltip="Copy To Clipboard"><i class="las la-paste"></i></div>
                    </ul>
                    <div [ngbNavOutlet]="nav2"></div>
                    
                    
                </figure>
                <!---Prism Pre code-->
            </div>
       
        </div>
    </div>

    <div class="col-md-12 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Seconds TimePicker</h3>
            </div>
            <div class="card-body ">
                <ngb-timepicker [(ngModel)]="stime" [seconds]="seconds"></ngb-timepicker>
                <br>
                <button class="btn btn-sm btn-outline-{{seconds ? 'success' : 'danger'}}" (click)="toggleSeconds()">
                    Seconds - {{seconds ? "ON" : "OFF"}}
                </button>
                
                <!---Prism Pre code-->
                <figure class="highlight mb-0" id="element1">
                    <ul ngbNav #nav3="ngbNav" class="nav nav-tabs">
                        <li [ngbNavItem]="1">
                            <a ngbNavLink class="html-code"><i class="las la-code mr-2"></i> HTML</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="html3"></code></pre>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="html-code">TS</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="ts3"></code></pre>
                            </ng-template>
                        </li>
                        <div ngxClipboard class="clipboard-icon ms-auto my-auto"  placement="top"
                        ngbTooltip="Copy To Clipboard"><i class="las la-paste"></i></div>
                    </ul>
                    <div [ngbNavOutlet]="nav3"></div>
                    
                    
                </figure>
                <!---Prism Pre code-->
            </div>
        
        </div>
    </div>

    <div class="col-md-12 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Spinner TimePicker</h3>
            </div>
            <div class="card-body ">
                <ngb-timepicker [(ngModel)]="spinnertime" [spinners]="spinners"></ngb-timepicker>
                <br>
                <button class="m-t-1 btn btn-sm btn-outline-{{spinners ? 'success' : 'danger'}}"
                    (click)="toggleSpinners()">
                    Spinners - {{spinners ? "ON" : "OFF"}}

                <figure class="highlight mb-0" id="element1">
                    <ul ngbNav #nav4="ngbNav" class="nav nav-tabs">
                        <li [ngbNavItem]="1">

                            <ng-template ngbNavContent>
                                <pre><code [highlight]="html4"></code></pre>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="html-code">TS</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="ts4"></code></pre>
                            </ng-template>
                        </li>
                        <div ngxClipboard class="clipboard-icon ms-auto my-auto"  placement="top"
                        ngbTooltip="Copy To Clipboard"><i class="las la-paste"></i></div>
                    </ul>
                    <div [ngbNavOutlet]="nav4"></div>
                    
                    
                </figure>
                <!---Prism Pre code-->
            </div>
         
        </div>
    </div>
</div>
