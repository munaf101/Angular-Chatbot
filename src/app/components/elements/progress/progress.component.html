<!--Page header-->
<app-page-header [title]="'Progress'"  [icon]="'server'"  [title1]="'Elements'" [activeitem]="'Progress'"></app-page-header>

<!--End Page header-->

<!-- Row -->
<div class="row">
    <div class="col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Basic Progress</h3>
            </div>
            <div class="card-body">
                <p>
                    <ngb-progressbar type="default" [value]="12"></ngb-progressbar>
                </p>
                <p>
                    <ngb-progressbar type="primary" [value]="25"></ngb-progressbar>
                </p>
                <p>
                    <ngb-progressbar type="primary" [value]="50"></ngb-progressbar>
                </p>
                <p>
                    <ngb-progressbar type="primary" [value]="75"></ngb-progressbar>
                </p>
                <p>
                    <ngb-progressbar type="primary" [value]="100"></ngb-progressbar>
                </p>
                <!---Prism Pre code-->
                <figure class="highlight mb-0" id="element1">
                    <ul ngbNav #nav1="ngbNav" class="nav nav-tabs">
                        <li [ngbNavItem]="1">
                            <a ngbNavLink class="html-code"><i class="las la-code mr-2"></i> HTML</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="html1"></code></pre>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="html-code">TS</a>
                            <ng-template ngbNavContent>
                                <pre><code [highlight]="ts1"></code></pre>
                            </ng-template>
                        </li>
                        <div ngxClipboard class="clipboard-icon ms-auto my-auto"  placement="top"
                        ngbTooltip="Copy To Clipboard"><i class="las la-paste"></i></div>
                    </ul>
                    <div [ngbNavOutlet]="nav1"></div>
    
    
                </figure>
                <!---Prism Pre code-->
            </div>

        
        </div>
    </div>
