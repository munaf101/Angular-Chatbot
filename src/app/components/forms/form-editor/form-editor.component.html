<!--Page header-->
<app-page-header [title]="'Form Editor'"  [icon]="'file-text'"  [title1]="'Forms'" [activeitem]="'Form Editor'"></app-page-header>

<!--End Page header-->
<div class="row row-sm">
    <div class="col-lg-12 col-md-12">
        <div class="card custom-card">
            <div class="card-body">
                <div>
                    <h6 class="main-content-label mb-1">Quill Editor</h6>
                    <p class="text-muted card-sub-title">Quill is a modern WYSIWYG editor built for compatibility and
                        extensibility. Replacement icons from default svg icons are made from <a
                            href="https://icons8.com/line-awesome" target="_blank">Line Awesome</a></p>
                </div>
                <quill-editor>
                    <div quill-editor-toolbar>
                        <span class="ql-formats">
                            <select class="ql-font">
                                <option selected></option>
                                <option value="serif"></option>
                                <option value="monospace"></option>
                            </select>
                            <select class="ql-size">
                                <option value="small"></option>
                                <option selected></option>
                                <option value="large"></option>
                                <option value="huge"></option>
                            </select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                            <button class="ql-strike"></button>
                        </span>
                        <span class="ql-formats">
                            <select class="ql-color"></select>
                            <select class="ql-background"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-list" value="ordered"></button>
                            <button class="ql-list" value="bullet"></button>
                            <select class="ql-align">
                                <option selected></option>
                                <option value="center"></option>
                                <option value="right"></option>
                                <option value="justify"></option>
                            </select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-link"></button>
                            <button class="ql-image"></button>
                        </span>
                    </div>
                </quill-editor>
            </div>
        </div>
    </div>
</div>
<!-- End Row -->

<!-- Row -->
<div class="row row-sm">
    <div class="col-lg-12 col-md-12">
        <div class="card custom-card">
            <div class="card-body">
                <div>
                    <h6 class="main-content-label mb-1">Ngx Editor</h6>
                </div>
             <form [formGroup]="form">
                    <div class="editor"> 
                  <ngx-editor-menu
                        class="border-1"
                        [editor]="editor"
                        [toolbar]="toolbar"
                      >
                      </ngx-editor-menu>
                      <ngx-editor [editor]="editor" formControlName="editorContent">
                      </ngx-editor>
                    </div>
                  </form>  
            </div>
        </div>
    </div>
</div>
<!-- End Row -->

<!-- Row -->
<div class="row row-sm">
    <div class="col-lg-12 col-md-12">
        <div class="card custom-card">
            <div class="card-body">
                <div>
                    <h6 class="main-content-label mb-1">Ngx Editor in Modal</h6>
                    <p class="text-muted card-sub-title">Ngx text editor that wrap inside a modal.</p>
                </div>
                <div class="">
                    <button type="button" class="btn ripple btn-primary" (click)="OpenEditor(editormodal)">View Live
                        Demo</button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End Row -->



<!--Modal-->

<ng-template #editormodal let-modal>
    <form [formGroup]="form">
        <div class="editor"> 
      <ngx-editor-menu
            class="border-1"
            [editor]="editor"
            [toolbar]="toolbar"
          >
          </ngx-editor-menu>
          <ngx-editor [editor]="editor" formControlName="editorContent">
          </ngx-editor>
        </div>
      </form>  </ng-template>
<!--/Modal-->
