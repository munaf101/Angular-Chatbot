<!--Page header-->
<app-page-header [title]="'Wish-List'"  [icon]="'shopping-cart'"  [title1]="'ECommerce'" [activeitem]="'Wish-List'"></app-page-header>

<!--End Page header-->

<!-- Row-->
<div class="row">
    <div class="col-lg-12 col-xl-12"  >
        <div class="row">
            <div class="col-xxl-3 col-xl-6 col-lg-6 col-md-6 alert border-0" *ngFor="let products of productData">
                <div class="card item-card ">
                    <div class="card-body pb-0">
                        <div class="text-center zoom">
                            <a routerLink='/e-commerce/product-details'><img class="w-100 rounded-2" src={{products.image}}  alt="img" ></a>
                        </div>
                        <div class="card-body px-0 pb-3">
                            <div class="row">
                                <div class="col-8">
                                    <div class="cardtitle">
                                        <div>
                                            <a href="javascript:void(0);"><i class="fa fa-star text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"><i class="fa fa-star text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"><i class="fa fa-star text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"><i class="fa fa-star text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"><i class="fa fa-star-half text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"><i class="fa fa-star-o text-warning fs-12"></i></a>
                                            <a href="javascript:void(0);"> ({{products.rating}})</a>
                                        </div>
                                        <a class="shop-title fs-18">{{products.name}}</a>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="cardprice-2">
                                        <span class="type--strikethrough number-font">${{products.price }}</span>
                                        <br>
                                        <span class="number-font">${{products.offerprice}}</span>
                                    </div>
                                </div>
                                <div>
                                    <p class="shop-description fs-13 text-muted mt-2 mb-0">the site of  sit amet consectetur, adipisicing elit. Dolor ipsum quia saepe esse.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <div class="text-center px-2">
                            <a routerLink="/e-commerce/shopping-cart" class="btn btn-md btn-primary m-1  w-45"><i class="fe fe-shopping-cart me-2"></i>Add to Cart</a>
                            <a  class="btn btn-md btn-light m-1  w-45" (click)="click(products.id)" data-bs-dismiss="alert" aria-label="Close">
                                <span class="me-2 fs-14">Remove</span>
                                <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 0 24 24" width="16px" fill="#495057"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
                            </a>
                        </div>
                     </div>
                </div>
            </div>
        
        </div>
        <div class="d-flex justify-content-end">
            <ngb-pagination [collectionSize]="40" [(page)]="alphabetpage" aria-label="Custom pagination" class="float-end">
                <ng-template ngbPaginationPrevious>Prev</ng-template>
                <ng-template ngbPaginationNext>Next</ng-template>
            </ngb-pagination>
        </div>
    </div>
</div>
<!-- End Row-->
