<div class="row row-sm my-1">

<div class="col-lg-12">
  <div class="card custom-card">
      <div class="card-header border-bottom">
          <h3 class="card-title">Question Search Word List</h3>
      </div>
      <div class="card-body ">
          <div class="table-responsive">
<div class="table-responsive">
  <table mat-table [dataSource]="dataSource" matSort  class="table text-nowrap table-bordered">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
    </ng-container>
  
    <!-- Conversation ID Column -->
    <ng-container matColumnDef="Question">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Question </th>
      <td mat-cell *matCellDef="let element"> {{ element.title }} </td>
    </ng-container>
  
    <!-- Question Column -->
    <!-- <ng-container matColumnDef="no_key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Question </th>
        <td mat-cell *matCellDef="let element" class="limited-text" [title]="element.questions"> {{ truncateText(element.questions, 9) }}   </td>
    </ng-container> -->
  
    <!-- Title Column -->
    <ng-container matColumnDef="no_key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> No of Keywords </th>
      <td mat-cell *matCellDef="let element"> {{ element.no_key }} </td>
    </ng-container>
  
    <!-- Parent Column -->
    <!-- <ng-container matColumnDef="parent">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Parent </th>
      <td mat-cell *matCellDef="let element"> {{ element.parent }} </td>
    </ng-container> -->
  
    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-sm btn-primary"   
        [routerLink]="['/key/search_edit', element.q_id]"
         >Edit</button>   
      </td>
    </ng-container> 
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <!-- <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td> -->
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
</div>
</div>
</div>
</div>
</div>
