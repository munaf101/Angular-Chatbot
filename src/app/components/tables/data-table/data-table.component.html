<!-- Row -->
<div class="row row-sm my-1">

    
<ng-template #largesizemodal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Modal title</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <!-- <p>Modal body text goes here.</p> -->
         <div class="row">
          <div class="col-md-12 col-lg-12">
            <!-- <div class="card"> -->
                <!-- <div class="card-header">
                    <h3 class="card-title">Shipping Details</h3>
                </div> -->
                <div class="card-body">
                  <div class="form-group ">
                    <label class="form-label">CardHolder Name</label>
                    <input type="email" class="form-control" id="inputEmail5" placeholder="Email Address">
                </div>
                    <div class="form-row">
                     
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="text" class="form-control" id="name1" placeholder="First Name">
                            </div>
                        </div>
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="text" class="form-control" id="name2" placeholder="Last Name">
                            </div>
                        </div>
                    </div>
                   
                    <div class="form-group ">
                        <input type="text" class="form-control" id="address" placeholder="AddressLine1">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="text" class="form-control" id="country" placeholder="Country">
                            </div>
                        </div>
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="text" class="form-control" id="region" placeholder="Country/Region">
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="text" class="form-control" id="city" placeholder="City">
                            </div>
                        </div>
                        <div class="form-group col-md-6 mb-0">
                            <div class="form-group">
                                <input type="number" class="form-control" id="postal" placeholder="Zip/Postal">
                            </div>
                        </div>
                    </div>
                    <!-- <div class="form-footer mt-2">
                        <button class="btn btn-primary">Confirm Details</button>
                    </div> -->
                </div>
            <!-- </div> --> 
        </div>
         </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.close('Close click')">Close</button>
        <button type="button" class="btn btn-indigo" >Save changes</button>
    </div>
  </ng-template>
    <div class="col-lg-12">
        <div class="card custom-card">
            <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                <h3 class="card-title">Question List</h3>
                  <button type="button" class="btn btn-primary"(click)="LargeSizeOpen(largesizemodal)" >Add New Question</button>
                  
            </div>
        
            <div class="card-body ">
                 <app-filter-sort-pagination></app-filter-sort-pagination>
            </div>
        </div>
    </div>

                <div class="table-responsive"> -->

            </div>
