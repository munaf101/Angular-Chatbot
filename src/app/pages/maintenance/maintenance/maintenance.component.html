      <div></div>

    <div class="page">
      <div class="page-content">
        <div class="container text-center">
          <div class="row">
            <div class="col-md-6">
              <div class="">
                <div class="text-white">
                
                  <div class="card-body">
                    <h2 class="mb-2 font-weight-bold text-white"><strong>Under Construction</strong></h2>
                    <h4 class="text-white-80 mb-5 text-white">Our website is in Under construction</h4>
                    <div id="launch_date"></div>

                    <div id="counterdiv" >
                      <ul class="countdown">
                        <li>
                          <span class="time">{{days}}</span><br>
                          <span class="title">Days</span>
                        </li>
                        <li>
                          <span class="time">{{hours}}</span><br>
                          <span class="title">Hours</span>
                        </li>
                        <li>
                          <span class="time">{{minutes}}</span><br>
                          <span class="title">Minutes</span>
                        </li>
                        <li>
                          <span class="time" class="time">{{seconds}}</span><br>
                          <span class="title">Seconds</span>
                        </li>
                      </ul>
                    </div>
                  </div>
                  <div class="row mb-5">
										<div class="col-md-10 d-block mx-auto">
											<div class="input-group mb-3">
												<input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
												<span class="btn btn-secondary  be-ts-0 be-bs-0" id="basic-addon1">Submit</span>
											  </div>
										</div>
									</div>
									<div class="custom-btns d-flex justify-content-center">
										<button class="btn btn-icon" type="button"><span class="btn-inner-icon m-2"><i class="fab fa-facebook-f"></i></span></button>
										<button class="btn btn-icon" type="button"><span class="btn-inner-icon m-2"><i class="fab fa-google"></i></span></button>
										<button class="btn btn-icon" type="button"><span class="btn-inner-icon m-2"><i class="fab fa-twitter"></i></span></button>
										<button class="btn btn-icon" type="button"><span class="btn-inner-icon m-2"><i class="fab fa-pinterest-p"></i></span></button>
									</div>
								</div>
							</div>
						</div>
						<div class="col-md-6 d-none d-md-flex align-items-center">
							<img src="./assets/images/png/construction.png" alt="img">
						</div>
          </div>
        </div>
